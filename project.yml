# XcodeGen turns this file into Mish.xcodeproj on the GitHub runner, so you never need a Mac
# or Xcode to edit the project: add Swift files to Mish/ and they are picked up automatically.
name: Mish

options:
  bundleIdPrefix: dev.mish
  deploymentTarget:
    iOS: "18.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Mish:
    type: application
    platform: iOS
    sources:
      - path: Mish
    resources:
      - path: Mish/Fonts
      - path: Mish/Assets.xcassets
      - path: Mish/Backgrounds
    info:
      path: Mish/Info.plist
      properties:
        CFBundleDisplayName: mish
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # keep playing with the screen locked / app in the background (no special entitlement needed)
        UIBackgroundModes:
          - audio
        # makes an "mish" folder appear in the Files app under "On My iPhone": drop music in there
        UIAppFonts:
          - delagothicone-regular.ttf
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mish.player
        TARGETED_DEVICE_FAMILY: "1"
