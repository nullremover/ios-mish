
name: Build Mish Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SwiftWasm
        id: swiftwasm
        uses: swiftwasm/setup-swiftwasm@v2
        with:
          target: wasm32-unknown-wasip1

      - name: Build browser app
        working-directory: Web
        run: |
          swift package resolve
          swift package --disable-sandbox \
            --swift-sdk "${{ steps.swiftwasm.outputs.swift-sdk-id }}" \
            js build

      - name: Inspect build output
        run: |
          find Web/.build/plugins/PackageToJS -type f -print

      - name: Prepare website
        run: |
          mkdir -p site
          cp Web/index.html site/

          echo "Build completed. Checking generated files:"
          find Web/.build/plugins/PackageToJS -type f \
            \( -name '*.js' -o -name '*.wasm' \) -print

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
