
name: Build Mish Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      
      - name: Install Swift 6.4.1
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.4.1"

      - name: Install matching WebAssembly SDK
        run: |
          swift sdk install \
            https://download.swift.org/swift-6.4.1-release/wasm-sdk/swift-6.4.1-RELEASE/swift-6.4.1-RELEASE_wasm.artifactbundle.tar.gz \
            --checksum 783e6128d174d9f975b4eda68be02a5960681b723ef372e6876a7c2543a365d8

      - name: Verify WebAssembly SDK
        run: swift sdk list

      - name: Build browser app
        working-directory: Web
        run: |
          swift package resolve
          swift package --disable-sandbox \
            --swift-sdk swift-6.4.1-RELEASE_wasm \
            js build


      - name: Inspect build output
        run: |
          find Web/.build/plugins/PackageToJS -type f -print

      - name: Prepare website
        run: |
          mkdir -p site
          cp Web/index.html site/

          echo "Build completed. Checking generated files:"
          find Web/.build/plugins/PackageToJS -type f \
            \( -name '*.js' -o -name '*.wasm' \) -print

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
